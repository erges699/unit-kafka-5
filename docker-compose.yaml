# ============================================================================
# Кластер Apache Kafka (KRaft) из трёх брокеров с защищённым SSL/mTLS соединением
#
# Роли:
#   kafka-1 : broker + controller (единственный контроллер KRaft-кворума)
#   kafka-2 : broker
#   kafka-3 : broker
#
# Лисенеры:
#   INTERNAL   : SSL        на 9092 — межброкерное и внутреннее взаимодействие
#   CONTROLLER : PLAINTEXT  на 9093 — KRaft-контроллер (только на kafka-1)
#   EXTERNAL   : SSL        на 9094/9095/9096 — для внешних клиентов
#
# Аутентификация: взаимный TLS (ssl.client.auth=required).
# Принципал клиента берётся из CN сертификата через ssl.principal.mapping.rules.
# Авторизация: StandardAuthorizer (KRaft) + ACL (см. scripts/setup_cluster.sh).
#
# Запуск:
#   bash scripts/generate_certs.sh     # сгенерировать сертификаты (при необходимости)
#   docker compose up -d --build kafka-1 kafka-2 kafka-3 setup
#   docker compose logs -f setup       # дождаться создания топиков и ACL
# ============================================================================

x-kafka-common: &kafka-common
  image: bitnamilegacy/kafka:3.7
  restart: always
  environment: &kafka-common-env
    KAFKA_ENABLE_KRAFT: yes
    ALLOW_PLAINTEXT_LISTENER: no
    KAFKA_KRAFT_CLUSTER_ID: unit5-ssl-kraft-cluster
    KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
    # Контроллер KRaft (нужен и для broker-only узлов, чтобы знать протокол)
    KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    # Карта протоколов безопасности лисенеров
    KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:SSL,EXTERNAL:SSL"
    # Межброкерный лисенер — SSL
    KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
    # Общие SSL-настройки
    KAFKA_CFG_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
    KAFKA_CFG_SSL_CLIENT_AUTH: required
    # Keystore / Truststore (стандартные имена Bitnami в каталоге certs)
    KAFKA_TLS_TYPE: JKS
    KAFKA_CERTIFICATE_PASSWORD: kafka-password
    # Авторизация через ACL (KRaft StandardAuthorizer).
    # Принцип: «разрешено по умолчанию» + явные DENY-ACL для запретов
    # (например, запрет чтения topic-2 для консьюмера). Так внутренние
    # KRaft-запросы (User:ANONYMOUS) не блокируют формирование кластера.
    KAFKA_CFG_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
    KAFKA_CFG_SUPER_USERS: "User:admin"
    KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND: true
    # Преобразование DN сертификата в короткий принципал (CN)
    KAFKA_CFG_SSL_PRINCIPAL_MAPPING_RULES: "RULE:^CN=(.*?),.*$/$1/,DEFAULT"
    # Топики создаём вручную через скрипт setup
    KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: false
  networks:
    - proxynet

services:

  # --------------------- Брокер 1 (broker + controller) ---------------------
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9092,EXTERNAL://localhost:9094"
    volumes:
      - kafka_1_data:/bitnami/kafka
      - ./kafka-1-creds:/opt/bitnami/kafka/config/certs:ro

  # ----------------------------- Брокер 2 -----------------------------
  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    ports:
      - "127.0.0.1:9095:9095"
    environment:
      <<: *kafka-common-env
      KAFKA_CFG_PROCESS_ROLES: broker
      KAFKA_CFG_NODE_ID: 2
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,EXTERNAL://:9095"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:9092,EXTERNAL://localhost:9095"
    volumes:
      - kafka_2_data:/bitnami/kafka
      - ./kafka-2-creds:/opt/bitnami/kafka/config/certs:ro

  # ----------------------------- Брокер 3 -----------------------------
  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    ports:
      - "127.0.0.1:9096:9096"
    environment:
      <<: *kafka-common-env
      KAFKA_CFG_PROCESS_ROLES: broker
      KAFKA_CFG_NODE_ID: 3
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,EXTERNAL://:9096"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:9092,EXTERNAL://localhost:9096"
    volumes:
      - kafka_3_data:/bitnami/kafka
      - ./kafka-3-creds:/opt/bitnami/kafka/config/certs:ro

  # ----------------------------- Настройка -----------------------------
  # Создаёт топики topic-1, topic-2 и применяет ACL.
  setup:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka-setup
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: ["/bin/bash", "/setup_cluster.sh"]
    volumes:
      - ./scripts/setup_cluster.sh:/setup_cluster.sh:ro
      - ./client-creds:/certs:ro
    networks:
      - proxynet

  # ----------------------------- Продюсер -----------------------------
  producer:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: kafka-producer
    command: ["python", "producer.py"]
    volumes:
      - ./client-creds:/app/certs:ro
    depends_on:
      - setup
    networks:
      - proxynet

  # ----------------------------- Консьюмер -----------------------------
  consumer:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: kafka-consumer
    command: ["python", "consumer.py"]
    volumes:
      - ./client-creds:/app/certs:ro
    depends_on:
      - setup
    networks:
      - proxynet

networks:
  proxynet:
    name: custom_network

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data: